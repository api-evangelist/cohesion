aid: cohesion
name: Cohesion
description: >-
  Cohesion is a New York City-based financial intelligence company (Y Combinator,
  Spring 2026) building AI agents that automate investment research for hedge funds
  and institutional investors. The platform continuously monitors public companies
  across earnings reports, news, podcasts, and social media such as X/Twitter to
  surface differentiated investing signals that fundamental equity analysts would
  otherwise spend hours a week tracking manually. Founded by Devon Krapcho (CEO),
  Matthew McBrien, and Matt Munns, its agents are used by 10+ long/short and
  long-only equity funds managing over $10 billion in assets. Marketed as "Modern
  Intelligence for Finance," Cohesion currently ships only a single-page marketing
  site with no public API, developer portal, documentation, or SDKs; this profile
  captures its verified company identity as an API Evangelist network lead.
